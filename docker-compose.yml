  db:
    image: postgres:16
    container_name: apibanco-database
    restart: unless-stopped
    networks:
      - apibanco-network
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: apibanco        # (Padrão Oficial)
      POSTGRES_USER: postgres      # (Padrão Oficial)
      POSTGRES_PASSWORD: postgres  # (Padrão Oficial)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apibanco"]
      interval: 10s
      timeout: 5s
      retries: 5
  eureka:
    build: 
      context: ./eurekaserver
      dockerfile: Dockerfile
    image: apibanco-eureka:1.0.0
    container_name: apibanco-eureka
    ports:
      - "8761:8761"
    networks:
      - apibanco-network
    depends_on:
      db:
        condition: service_healthy
    #   rabbitmq:
    #     condition: service_healthy
    # ADICIONADO: Healthcheck nativo para o Eureka sem precisar de comandos complexos
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8761' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  kafka:
    image: confluentinc/cp-kafka:7.6.0  # Versão estável e moderna do Kafka
    container_name: apibanco-kafka
    ports:
      - "9092:9092"                     # Porta usada para conexões de fora do Docker (sua IDE/máquina)
    networks:
      - apibanco-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092' # kafka:29092 para dentro do docker, localhost:9092 para fora
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Configurações do modo KRaft (Sem Zookeeper)
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM0Qk' # ID único aleatório para identificar o cluster KRaft
  
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1 # Versão moderna e compatível
    container_name: apibanco-kafdrop
    ports:
      - "9000:9000"                       # Porta para acessar no seu navegador
    networks:
      - apibanco-network
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"  # Aponta para o nome do serviço kafka do compose
      JVM_OPTS: "-Xms32M -Xmx64M"         # Super leve, consome pouquíssima memória
    depends_on:
      - kafka
  
  mstransacoes:
    build: 
      context: ./mstransacoes
      dockerfile: Dockerfile
    image: apibanco-mstransacoes:1.0.0
    container_name: apibanco-mstransacoes
    networks:
      - apibanco-network
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    # ADICIONADO: Aguarda 10 segundos para o Eureka subir totalmente antes de disparar o Java
    entrypoint: ["sh", "-c", "sleep 10 && java -jar app.jar"]
    environment:
      DB_HOST: db    # Aponta para o nome do serviço do banco
      DB_PORT: 5432  # Comunicação interna entre containers usa sempre 5432
      DB_NAME: apibanco
      DB_USER: postgres
      DB_PASSWORD: postgres
      # EUREKA_SERVER: apibanco-eureka
      EUREKA_URI: http://apibanco-eureka:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092


  mscloudgateway:
    build: 
      context: ./mscloudgateway
      dockerfile: Dockerfile
    image: apibanco-msgateway:1.0.0
    container_name: apibanco-msgateway
    ports:
      - "8080:8080"
    restart: on-failure # <--- Resiliência caso o Eureka demore para aceitar conexões
    networks:
      - apibanco-network
    depends_on:
      eureka:
        condition: service_started
      # - keycloak
    # ADICIONADO: Aguarda 12 segundos para garantir o Eureka respondendo rotas
    entrypoint: ["sh", "-c", "sleep 12 && java -jar app.jar"]
    environment:
      EUREKA_URI: http://apibanco-eureka:8761/eureka/
      # - KEYCLOAK_SERVER: apibancokeycloak
      # - KEYCLOAK_PORT: 8080

  msextratoconsumer:
    build: 
      context: ./msextratoconsumer
      dockerfile: Dockerfile
    image: apibanco-msextratoconsumer:1.0.0
    container_name: apibanco-msextratoconsumer
    networks:
      - apibanco-network
    depends_on:
      eureka:
        condition: service_started
      kafka:
        condition: service_started
      cassandra:
        condition: service_healthy # Só liga o consumidor quando o Cassandra estiver 100% pronto
    # ADICIONADO: Aguarda 15 segundos para garantir o Eureka respondendo rotas e o Kafka pronto
    entrypoint: ["sh", "-c", "sleep 15 && java -jar app.jar"]
    environment:
      EUREKA_URI: http://apibanco-eureka:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CASSANDRA_HOST: cassandra
  
  cassandra:
    image: cassandra:4.1
    container_name: apibanco-cassandra
    ports:
      - "9042:9042"
    networks:
      - apibanco-network
    environment:
      - CASSANDRA_CLUSTER_NAME=apibanco-cluster
      - CASSANDRA_DC=datacenter1
      # CORREÇÃO AQUI: Removemos o JVM_OPTS e usamos as variáveis nativas do Cassandra.
      # Definimos 1GB de Heap e 256MB de New Size (perfeito para rodar leve e sem quebrar os cálculos da JVM).
      - CASSANDRA_HEAPSIZE=1G
      - CASSANDRA_NEWSIZE=256M
      # - JVM_OPTS=-Xms512M -Xmx1024M # Limitando memória para não pesar no PC
      # - CASSANDRA_RACK=rack1
      # CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
    healthcheck:
      # Alterado para usar o comando 'nodetool status' que é mais confiável e leve para checar a saúde
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN' || exit 1"]
      # test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 5
  
  # Container temporário que cria a tabela no Cassandra assim que ele estiver saudável
  cassandra-init:
    image: cassandra:4.1
    container_name: apibanco-cassandra-init
    networks:
      - apibanco-network
    depends_on:
      cassandra:
        condition: service_healthy
    command: >
      /bin/bash -c "
        echo 'Criando keyspace e tabelas no Cassandra...';
        cqlsh cassandra 9042 -e \"
          CREATE KEYSPACE IF NOT EXISTS bank_history 
          WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};
          
          CREATE TABLE IF NOT EXISTS bank_history.transactions_by_account (
              account_id text,
              transaction_time timestamp,
              transaction_id uuid,
              account_destination text,
              amount decimal,
              type text,
              status text,
              PRIMARY KEY ((account_id), transaction_time)
          ) WITH CLUSTERING ORDER BY (transaction_time DESC);
        \"
      "

volumes:
  # rabbitmq_data:
  # keycloak_data:
  # eurekaserver_data:
  # mstransacoes_data:
  # msclientes_data:
  # msavaliadorcredito_data:
  # mscloudgateway_data:
  postgres_data:

networks:
  apibanco-network:
    driver: bridge